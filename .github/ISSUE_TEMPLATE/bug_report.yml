name: Bug report / 错误报告
description: Report a reproducible defect without sensitive data / 报告可复现问题，请先脱敏
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. For security-sensitive issues, use the private reporting link instead of this public form.
        感谢反馈。涉及安全的问题请使用私密报告入口，不要填写此公开表单。
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version / 插件版本
      placeholder: 0.6.8
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      description: Operating system, BetterDiscord version, and Discord channel / 操作系统、BetterDiscord 版本、Discord 渠道
      placeholder: Windows 11; BetterDiscord 1.x; Discord Stable
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 模块
      options:
        - Entry and UI / 入口与界面
        - Scan / 扫描
        - AI review / AI 审查
        - Delete / 删除
        - Export / 导出
        - Settings and diagnostics / 设置与诊断
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics / 已脱敏诊断信息
      description: Remove keys, credentials, endpoints, message content, and user/channel/server IDs / 删除密钥、凭据、端点、消息正文及用户/频道/服务器 ID
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 检查项
      options:
        - label: I searched existing issues / 我已搜索现有 Issue
          required: true
        - label: I removed sensitive data from this report / 我已移除敏感信息
          required: true
