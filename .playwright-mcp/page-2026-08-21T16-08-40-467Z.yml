    - heading "一套字形：Material Symbols Rounded" [level=2] [ref=e437]
    - paragraph [ref=e438]:
      - text: 审计结论：全插件 23 枚 SVG 里功能图标 17 枚，多数已是填充风格，但
      - strong [ref=e439]: info 混入了描边圆圈
      - text: （全场唯一 stroke 元素）、
      - strong [ref=e440]: 下拉箭头是实心三角
      - text: ，字形来源零散。Discord 官方图标是客户端私有资产，没有公开库——要用只能运行时从 webpack 抽取，违背"只有 DiscordAdapter 碰 Discord 内部"的架构铁律，且每次客户端更新都是断点。方案：全部功能图标统一到
      - strong [ref=e441]: Material Symbols Rounded 填充版
      - text: （Apache 2.0，与 Discord 现行图标同为"填充 + 圆角 + 几何"气质），一律 currentColor，尺寸只由 CSS 槽位（12/14/16/18/20）控制。品牌标（GitHub、五家平台、插件自身）不是功能图标，保持原生不动。
