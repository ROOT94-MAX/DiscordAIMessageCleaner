    - heading "一套字形：Material Symbols Rounded" [level=2] [ref=f2e437]
    - paragraph [ref=f2e438]:
      - text: 审计结论：全插件 23 枚 SVG 里功能图标 17 枚，多数已是填充风格，但
      - strong [ref=f2e439]: info 混入了描边圆圈
